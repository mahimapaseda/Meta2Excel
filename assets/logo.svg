<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Card: Clean bright vibrant rounded container with soft glow -->
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>

    <!-- Meta Blue Signature Gradients -->
    <linearGradient id="metaBlueVibrant" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00C6FF" />
      <stop offset="40%" stop-color="#0081FB" />
      <stop offset="100%" stop-color="#0064E0" />
    </linearGradient>

    <linearGradient id="metaLoopGradient" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0064E0" />
      <stop offset="50%" stop-color="#0081FB" />
      <stop offset="100%" stop-color="#00D4FF" />
    </linearGradient>

    <linearGradient id="metaToExcelBridge" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#0081FB" />
      <stop offset="40%" stop-color="#06B6D4" />
      <stop offset="70%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Excel Green Signature Gradients -->
    <linearGradient id="excelGreenBack" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107C41" />
      <stop offset="100%" stop-color="#0E5C32" />
    </linearGradient>

    <linearGradient id="excelGreenFront" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#33C481" />
      <stop offset="50%" stop-color="#21A366" />
      <stop offset="100%" stop-color="#107C41" />
    </linearGradient>

    <linearGradient id="excelGreenSheet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22C55E" />
      <stop offset="100%" stop-color="#15803D" />
    </linearGradient>

    <!-- Arrow / Energy Stream -->
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0081FB" />
      <stop offset="50%" stop-color="#06B6D4" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>
  </defs>

  <!-- ============================================================== -->
  <!-- 1. BASE BADGE: Clean White/Slate Modern Squircle               -->
  <!-- ============================================================== -->
  <!-- Outer Soft Shadow Ring -->
  <rect x="22" y="26" width="468" height="468" rx="104" fill="#000000" opacity="0.10" />
  <rect x="20" y="22" width="472" height="472" rx="104" fill="#000000" opacity="0.06" />

  <!-- Main Card Body -->
  <rect x="20" y="20" width="472" height="472" rx="104" fill="url(#cardBg)" stroke="#CBD5E1" stroke-width="2.5" />

  <!-- Subtle Colorful Corner Ambient Glows -->
  <circle cx="100" cy="100" r="140" fill="#0081FB" opacity="0.08" />
  <circle cx="410" cy="410" r="140" fill="#10B981" opacity="0.09" />
  <circle cx="390" cy="120" r="120" fill="#22C55E" opacity="0.07" />

  <!-- ============================================================== -->
  <!-- 2. LEFT: Authentic Vibrant Meta Infinity Ribbon                -->
  <!-- ============================================================== -->
  <g id="metaRibbonSection" transform="translate(10, 0)">
    <!-- Meta Loop Back Arc (Left Loop Top & Outer) -->
    <path d="M 175 295
             C 125 335, 60 320, 60 256
             C 60 190, 115 160, 165 210
             C 195 240, 225 285, 256 285
             C 275 285, 290 275, 305 258"
          fill="none"
          stroke="url(#metaLoopGradient)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <!-- Meta Loop Front Arc (Creates the classic 3D infinity crossover) -->
    <path d="M 140 215
             C 185 165, 240 185, 270 230
             C 295 268, 315 295, 345 295
             C 385 295, 415 260, 415 220"
          fill="none"
          stroke="url(#metaBlueVibrant)"
          stroke-width="40"
          stroke-linecap="round"
          stroke-linejoin="round"
          opacity="0.4" />

    <!-- Meta Left Eye Highlight -->
    <ellipse cx="110" cy="240" rx="20" ry="32" fill="#FFFFFF" opacity="0.2" transform="rotate(-15 110 240)" />
  </g>

  <!-- ============================================================== -->
  <!-- 3. CENTER: Dynamic Energy Transformation Bridge                -->
  <!-- ============================================================== -->
  <g id="transformationArrow">
    <!-- Fluid flow line connecting Meta into Excel -->
    <path d="M 220 256 L 275 256"
          stroke="url(#arrowGrad)"
          stroke-width="12"
          stroke-linecap="round"
          stroke-dasharray="1 18" />

    <!-- Dynamic Flow Arrow Chevron -->
    <path d="M 248 238 L 268 256 L 248 274"
          fill="none"
          stroke="#0081FB"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round" />

    <path d="M 264 238 L 284 256 L 264 274"
          fill="none"
          stroke="#10B981"
          stroke-width="8"
          stroke-linecap="round"
          stroke-linejoin="round" />
  </g>

  <!-- ============================================================== -->
  <!-- 4. RIGHT: Authentic Microsoft Excel Icon & Spreadsheet Sheet   -->
  <!-- ============================================================== -->
  <g id="excelSection" transform="translate(245, 130)">
    <!-- Back Spreadsheet Sheet with Grid (Layer 1) -->
    <rect x="44" y="24" width="180" height="210" rx="16" fill="#000000" opacity="0.12" />
    <rect x="40" y="20" width="180" height="210" rx="16" fill="url(#excelGreenSheet)" stroke="#15803D" stroke-width="2" />

    <!-- Sheet Header Bar (Darker Excel Green) -->
    <path d="M 40 36 C 40 27, 47 20, 56 20 L 204 20 C 213 20, 220 27, 220 36 L 220 62 L 40 62 Z" fill="#0E5C32" />

    <!-- Grid Columns & Rows -->
    <!-- Column 1 -->
    <line x1="100" y1="20" x2="100" y2="230" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.35" />
    <!-- Column 2 -->
    <line x1="160" y1="20" x2="160" y2="230" stroke="#FFFFFF" stroke-width="1.8" stroke-opacity="0.35" />

    <!-- Row Dividers -->
    <line x1="40" y1="62" x2="220" y2="62" stroke="#FFFFFF" stroke-width="2.2" stroke-opacity="0.5" />
    <line x1="40" y1="104" x2="220" y2="104" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />
    <line x1="40" y1="146" x2="220" y2="146" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />
    <line x1="40" y1="188" x2="220" y2="188" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.25" />

    <!-- Simulated Data Cells inside Excel sheet -->
    <rect x="110" y="76" width="38" height="14" rx="4" fill="#FFFFFF" opacity="0.8" />
    <rect x="170" y="76" width="38" height="14" rx="4" fill="#6EE7B7" opacity="0.95" />

    <rect x="110" y="118" width="38" height="14" rx="4" fill="#FFFFFF" opacity="0.7" />
    <rect x="170" y="118" width="38" height="14" rx="4" fill="#FFFFFF" opacity="0.9" />

    <rect x="110" y="160" width="38" height="14" rx="4" fill="#6EE7B7" opacity="0.95" />
    <rect x="170" y="160" width="38" height="14" rx="4" fill="#FFFFFF" opacity="0.7" />

    <rect x="110" y="200" width="38" height="14" rx="4" fill="#FFFFFF" opacity="0.8" />
    <rect x="170" y="200" width="38" height="14" rx="4" fill="#34D399" opacity="1.0" />

    <!-- ============================================================ -->
    <!-- Front Embossed Excel "X" Tile (Layer 2)                      -->
    <!-- ============================================================ -->
    <rect x="6" y="58" width="118" height="124" rx="20" fill="#000000" opacity="0.18" />
    <rect x="4" y="54" width="118" height="124" rx="20" fill="url(#excelGreenFront)" stroke="#22C55E" stroke-width="2" />

    <!-- Tile Top Bevel / Gloss Highlight -->
    <path d="M 4 74 C 4 63, 13 54, 24 54 L 102 54 C 113 54, 122 63, 122 74 L 122 108 L 4 108 Z" fill="#FFFFFF" opacity="0.15" />

    <!-- Crisp White Microsoft Excel "X" -->
    <path d="M 36 78
             L 51 78
             L 63 99
             L 75 78
             L 90 78
             L 73 115
             L 91 154
             L 76 154
             L 63 129
             L 49 154
             L 34 154
             L 53 115
             Z"
          fill="#FFFFFF" />
  </g>

  <!-- ============================================================== -->
  <!-- 5. POLISH & SPARKLES                                            -->
  <!-- ============================================================== -->
  <!-- Top Left Meta Sparkle (Electric Cyan) -->
  <path d="M 85 95 Q 85 108 98 108 Q 85 108 85 121 Q 85 108 72 108 Q 85 108 85 95 Z" fill="#0081FB" />
  <circle cx="85" cy="108" r="3" fill="#FFFFFF" />

  <!-- Top Right Excel Sparkle (Emerald Mint) -->
  <path d="M 435 90 Q 435 103 448 103 Q 435 103 435 116 Q 435 103 422 103 Q 435 103 435 90 Z" fill="#10B981" />
  <circle cx="435" cy="103" r="3" fill="#FFFFFF" />

  <!-- Bottom Accent Dot -->
  <circle cx="256" cy="455" r="4" fill="#0081FB" opacity="0.4" />
  <circle cx="242" cy="455" r="3" fill="#06B6D4" opacity="0.4" />
  <circle cx="270" cy="455" r="3" fill="#10B981" opacity="0.4" />
</svg>
